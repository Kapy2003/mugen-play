<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="dark-bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14141a" />
      <stop offset="60%" stop-color="#08080c" />
      <stop offset="100%" stop-color="#020204" />
    </radialGradient>

    <!-- Glowing Ruby Glass Core Gradient -->
    <radialGradient id="ruby-glass-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff2e3b" />
      <stop offset="35%" stop-color="#e50914" />
      <stop offset="75%" stop-color="#90040b" />
      <stop offset="100%" stop-color="#550005" />
    </radialGradient>

    <!-- Intense Outer Rim Neon 'Leash' Glow Filter -->
    <filter id="outer-rim-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff1e2b" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#e50914" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="40" flood-color="#ff0022" flood-opacity="0.5" />
    </filter>

    <!-- Glowing M Emblem Filter: White-hot core with crimson radiation -->
    <filter id="glowing-m-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ff4d58" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#e50914" flood-opacity="0.6" />
    </filter>

    <!-- Top Gloss Highlight -->
    <linearGradient id="gloss-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- 1. Dark Obsidian Canvas Base -->
  <rect width="512" height="512" rx="128" fill="url(#dark-bg-grad)" />

  <!-- 2. Radiant Outer Crimson Glow Backlight -->
  <rect x="76" y="76" width="360" height="360" rx="92" fill="#e50914" opacity="0.35" filter="blur(24px)" />

  <!-- 3. Outer Neon Rim / 'Leash' Border with Intense Glow -->
  <rect x="72" y="72" width="368" height="368" rx="96" fill="none" stroke="#ff2a38" stroke-width="4.5" filter="url(#outer-rim-glow)" />

  <!-- 4. Ruby Glass Main Squircle -->
  <rect x="72" y="72" width="368" height="368" rx="96" fill="url(#ruby-glass-grad)" />

  <!-- 5. Top Curved Gloss Reflection -->
  <path d="M 76 168 C 76 116 116 76 168 76 L 344 76 C 396 76 436 116 436 168 C 436 216 364 248 256 248 C 148 248 76 216 76 168 Z" fill="url(#gloss-highlight)" />

  <!-- 6. Inner Precision Edge Highlight -->
  <rect x="78" y="78" width="356" height="356" rx="90" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- 7. Vibrant Glowing White 'M' Core -->
  <g filter="url(#glowing-m-filter)">
    <path d="M 148 164 
             L 204 164 
             L 256 264 
             L 308 164 
             L 364 164 
             L 364 348 
             L 316 348 
             L 316 226 
             L 270 310 
             L 242 310 
             L 196 226 
             L 196 348 
             L 148 348 
             Z" 
          fill="#ffffff" />
  </g>
</svg>
