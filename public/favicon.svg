<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Crimson Gradient matching from-red-600 to-red-800 -->
    <linearGradient id="mugen-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a24" />
      <stop offset="25%" stop-color="#e50914" />
      <stop offset="70%" stop-color="#b20710" />
      <stop offset="100%" stop-color="#830007" />
    </linearGradient>

    <!-- Subtle Top Glass Shine -->
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#e50914" flood-opacity="0.45" />
    </filter>

    <!-- Inner Letter Shadow for High-Definition Depth -->
    <filter id="letter-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <rect x="36" y="36" width="440" height="440" rx="112" fill="#e50914" opacity="0.25" filter="blur(28px)" />

  <!-- Main Red Gradient Squircle -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#mugen-red-grad)" stroke="#ff4d56" stroke-width="3" filter="url(#crimson-glow)" />

  <!-- Top Curved Glass Reflection -->
  <path d="M 32 140 C 32 82 82 32 140 32 L 372 32 C 430 32 480 82 480 140 C 480 200 400 240 256 240 C 112 240 32 200 32 140 Z" fill="url(#glass-shine)" />

  <!-- Inner Subtle Border Stroke -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

  <!-- Signature Bold White "M" Logo -->
  <g filter="url(#letter-depth)">
    <!-- Path for Perfectly Balanced Geometric 'M' with Anime Edge Sharpness -->
    <path d="M 124 136 
             L 192 136 
             L 256 252 
             L 320 136 
             L 388 136 
             L 388 376 
             L 332 376 
             L 332 216 
             L 274 320 
             L 238 320 
             L 180 216 
             L 180 376 
             L 124 376 
             Z" 
          fill="#ffffff" />
  </g>
</svg>
